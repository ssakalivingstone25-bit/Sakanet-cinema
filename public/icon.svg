<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="sakanetRedGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#8E060D" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
    <filter id="logoDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#E50914" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Dark Obsidian Container with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- Center Ambient Red Glow -->
  <circle cx="256" cy="240" r="140" fill="#E50914" opacity="0.15" />

  <!-- Scaled Cinematic S Ribbon + Play Glyph -->
  <g transform="translate(86, 76) scale(3.4)" filter="url(#logoDrop)">
    <!-- Stylized Modern Cinematic "S" Ribbon -->
    <path
      d="M78 26 C78 14 62 10 50 10 C30 10 18 20 18 36 C18 52 38 56 54 62 C70 68 76 74 76 84 C76 96 58 98 44 98 C28 98 16 90 16 78"
      stroke="url(#sakanetRedGrad)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Highlight Curve -->
    <path
      d="M50 10 C62 10 74 13 74 22"
      stroke="url(#innerGlow)"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Centered Cinema Play Action Triangle -->
    <polygon
      points="46,42 62,50 46,58"
      fill="#FFFFFF"
    />
  </g>
</svg>
