<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="primaryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="cinemaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e50914" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  <g filter="url(#cinemaShadow)" transform="translate(106, 106)">
    <!-- Movie Projector Reel & Modern Cinema Letter S -->
    <path d="M 70 50 C 70 20, 230 20, 230 50 C 230 80, 70 120, 70 180 C 70 250, 230 250, 230 220" 
          fill="none" 
          stroke="url(#primaryRed)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Play Action Triangle inside center -->
    <polygon points="125,120 185,150 125,180" fill="#ffffff" />
  </g>
</svg>
